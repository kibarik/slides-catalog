server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|pdf)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }
}
