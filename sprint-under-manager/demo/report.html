  function infoHtml(kind, stat) {
    var li = function (list) { return '<ul>' + list.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>'; };
    return '<span class="info" tabindex="0" role="button" aria-label="Как читать график">' +
      '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"' +
      ' stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.3v3.6M8 5.1h.01"/></svg>' +
      '<span class="info-tip" role="tooltip">' + (stat ? '<div class="stat">' + stat + '</div>' : '') +
      '<b>Как читать</b>' + li(CHART_INFO[kind]) +
      '</span></span>';
  }

  function controlStat(c) {
    if (!c || !c.points || !c.points.length) return '';
    return 'За ' + c.days + ' дн.: медиана <strong>' + fmt(c.median) + '</strong> дн., среднее <strong>' +
      fmt(c.mean) + '</strong> дн., σ ' + fmt(c.sd) + '.';

  // раздел графика: правый клик по нему — заметка к графику целиком
  function chartSection(title, info, body) {
    return '<div class="metrics-section"' + ctxAttr({ kind: 'chart', title: title }) + '><h3>' + esc(title) + info + '</h3>' +
      body + '</div>';
  }

  function fillMetricsPanel() {
    var html = '';
    html += chartSection('Burndown текущего спринта', infoHtml('burndown'), burndownChart());
    html += chartSection('Производительность: запланировано / сделано', infoHtml('velocity'), velocityChart());
    html += chartSection('Диаграмма управления — истории', infoHtml('control', controlStat(CONTROL.stories)),
      controlChart(CONTROL.stories, 'историй', 'story'));
    html += chartSection('Диаграмма управления — подзадачи', infoHtml('control', controlStat(CONTROL.subtasks)),

  // ------------------ Лента изменений статусов ------------------
  // Кто какую задачу куда перевёл за последнюю неделю. Фильтр по автору.
  var logsFilter = null;

  var logsKind = null;

  function renderLogs() {
    var all = (LOGS && LOGS.events) || [];
    var events = all.filter(function (e) {
      if (logsFilter && e.author !== logsFilter) return false;
      if (logsKind && e.kind !== logsKind) return false;
      return true;
    });

    var kinds = (LOGS && LOGS.kinds) || {};
    var chips = '<div class="log-filters">' +
      '<button class="log-chip' + (logsKind ? '' : ' active') + '" data-kind="">Всё · ' + all.length + '</button>' +
      LOG_KINDS.filter(function (k) { return kinds[k.id]; }).map(function (k) {
        return '<button class="log-chip' + (logsKind === k.id ? ' active' : '') +
          '" data-kind="' + k.id + '">' + esc(k.label) + ' · ' + kinds[k.id] + '</button>';
      }).join('') + '</div>' +
      '<div class="log-filters">' +
      '<button class="log-chip' + (logsFilter ? '' : ' active') + '" data-author="">Все</button>' +
      ((LOGS && LOGS.authors) || []).map(function (a) {
        return '<button class="log-chip' + (logsFilter === a[0] ? ' active' : '') +
          '" data-author="' + esc(a[0]) + '">' + esc(initials(a[0])) + ' ' + esc(a[0].split(' ')[0]) + ' · ' + a[1] + '</button>';
      }).join('') + '</div>';

    if (!events.length) {
      storiesBody.innerHTML = chips + '<div class="log-empty">За период изменений нет.</div>';
      bindLogChips();
      return;
    }

    var html = chips, lastDay = null;
    events.forEach(function (e) {
      var day = dayLabel(e.at);
      if (day !== lastDay) { html += '<div class="log-day">' + esc(day) + '</div>'; lastDay = day; }
      html += '<div class="log-item"' + ctxAttr({ kind: 'event', key: e.key, title: e.title, rowId: null }) + '>' +
        '<div class="log-who" title="' + esc(e.author) + '">' + esc(initials(e.author)) + '</div>' +
        '<div class="log-main">' +
          '<div class="log-head"><span class="log-author">' + esc(e.author) + '</span>' +
            '<span class="log-time">' + esc(relTime(e.at)) + '</span></div>' +
          logEventBody(e) +
          '<div class="log-issue"><a href="' + jiraUrl(e.key) + '" target="_blank" rel="noopener">' +
            esc(e.key) + ' — ' + esc(e.title) + '</a></div>' +
        '</div></div>';
    });

    storiesBody.innerHTML = html;
    bindLogChips();
  }

  function bindLogChips() {
    storiesBody.querySelectorAll('.log-chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.dataset.kind !== undefined) logsKind = btn.dataset.kind || null;
        else logsFilter = btn.dataset.author || null;
        renderLogs();
      });
    });
  }

      : 'Кто что менял за последние ' + ((LOGS && LOGS.days) || 7) + ' дней';

  // «Команда: N» — участники за 3 спринта: выработка по группам, Lead time; клик по

  // ------------------------- ✋ Блокаторы -------------------------
  // Группы по длительности стоянки (рабочие дни): дольше стоит — выше. В группе
  // видно BLK_SHOW строк, остальное — по «ещё N». Под списком — где стоим: дни
  // в блоке по инициативам (эпикам) и по людям; тап по человеку — только его блокаторы.
  var BLK_GROUPS = [
    { id: 'g10', label: '10+ дней', test: function (d) { return d >= 10; } },
    { id: 'g5', label: '5–10 дней', test: function (d) { return d >= 5 && d < 10; } },
    { id: 'g3', label: '3–5 дней', test: function (d) { return d >= 3 && d < 5; } },
    { id: 'g0', label: 'до 3 дней', test: function (d) { return d < 3; } },
    { id: 'gx', label: 'начало неизвестно', test: function (d) { return d == null; } }
  ];
  var BLK_SHOW = 5, BLK_TOP = 5;
  var blkState = { who: null, open: {} };

  // имя — shortName() общего движка: «Парфило Сергей Иванович» → «Парфило С. И.»; без исполнителя — NOBODY
  var NOBODY = 'Не назначен';
  function blockerTarget(b) {
    return { kind: 'blocker', key: b.key, title: b.title, status: b.status, assignee: b.assignee,
             epicKey: b.epicKey, epicTitle: b.epicTitle, rowId: b.rowId, why: b.why, days: b.days };
  }

  function daysText(d) { return d == null ? '?' : d + ' ' + plural(d, 'день', 'дня', 'дней'); }

  function blkRow(b) {
    var why = b.why === 'stale' ? 'без движения' : 'в ожидании';
    var link = b.url ? '<a class="blk-key" href="' + esc(b.url) + '" target="_blank" rel="noopener">' + esc(b.key) + '</a>'
      : '<span class="blk-key">' + esc(b.key) + '</span>';
    return '<li class="blk-row ' + (b.why === 'stale' ? 'stale' : 'wait') + '" data-blk="' + esc(b.key) + '"' + ctxAttr(blockerTarget(b)) +
      ' title="' + esc(b.comment ? 'Последний комментарий — ' + (b.comment.by || '') + ': ' + b.comment.text : 'Тап — комментарий для ИИ-агента') + '">' +
      '<div class="blk-main"><div class="blk-title">' + esc(b.title) + '</div>' +
      '<div class="blk-sub">' + esc(shortName(b.assignee || NOBODY)) + ' · ' + why + ' · ' + link +
        '<span class="blk-cm" data-cmark="' + esc(b.key) + '"></span></div></div>' +
      '<div class="blk-days">' + esc(daysText(b.days)) + '</div></li>';
  }

  function blkBars(title, rows, kind) {
    if (!rows.length) return '';
    var max = Math.max.apply(null, rows.map(function (r) { return r.days || 0; })) || 1;
    return '<div class="blk-bars"><h3>' + title + '</h3>' + rows.slice(0, BLK_TOP).map(function (r) {
      var label = kind === 'epic' ? r.title : shortName(r.name);
      var on = kind === 'person' && blkState.who === r.name;
      var attr = kind === 'epic' ? ' data-blk-epic="' + esc(r.rowId || '') + '"' : ' data-blk-who="' + esc(r.name) + '"';
      return '<button type="button" class="blk-bar' + (on ? ' on' : '') + '"' + attr + ' title="' +
        esc(label + ': ' + r.count + ' ' + plural(r.count, 'задача', 'задачи', 'задач') + ', ' + r.days + ' раб. ' + plural(r.days, 'день', 'дня', 'дней')) + '">' +
        '<span class="blk-bar-label">' + esc(label) + '</span>' +
        '<span class="blk-bar-track"><span style="width:' + Math.max(4, Math.round(100 * (r.days || 0) / max)) + '%"></span></span>' +
        '<span class="blk-bar-n">' + r.days + '</span></button>';
    }).join('') + '</div>';
  }

  function renderBlockers() {
    var box = document.getElementById('blockers');
    var data = team.blockers;
    if (!data) { box.hidden = true; return; }   // страница без наложения (старый runner)
    box.hidden = false;
    var all = data.items || [];
    if (blkState.who && !all.some(function (b) { return (b.assignee || NOBODY) === blkState.who; })) blkState.who = null;
    var items = blkState.who ? all.filter(function (b) { return (b.assignee || NOBODY) === blkState.who; }) : all;
    var head = '<div class="blk-head"><h2>✋ Блокаторы' + (all.length ? '<span class="n">' + all.length + '</span>' : '') + '</h2>' +
      (blkState.who ? '<button type="button" class="blk-reset" data-blk-who="">' + esc(shortName(blkState.who)) + ' ✕</button>' : '') +
      '<small>' + (all.length ? 'тап по строке — комментарий для ИИ-агента' : '') + '</small></div>';
    if (!all.length) {
      box.innerHTML = head + '<p class="blk-empty">Ничего не стоит: ни «в ожидании», ни без движения ' + data.staleDays + '+ раб. дня.</p>';
      return;
    }
    var groups = BLK_GROUPS.map(function (g) {
      var list = items.filter(function (b) { return g.test(b.days); });
      if (!list.length) return '';
      var open = blkState.open[g.id], shown = open ? list : list.slice(0, BLK_SHOW);
      return '<div class="blk-group"><h3>' + g.label + '<span class="n">' + list.length + '</span></h3><ul>' +
        shown.map(blkRow).join('') + '</ul>' +
        (list.length > shown.length ? '<button type="button" class="blk-more" data-blk-more="' + g.id + '">ещё ' + (list.length - shown.length) + '</button>' : '') +
        '</div>';
    }).join('');
    box.innerHTML = head + '<div class="blk-groups">' + groups + '</div>' +
      '<div class="blk-sum">' + blkBars('Инициативы · дней в блоке', data.byEpic || [], 'epic') +
        blkBars('Люди · дней в блоке', data.byPerson || [], 'person') + '</div>';
    refreshComments();
  }

  document.getElementById('blockers').addEventListener('click', function (e) {
    if (e.target.closest('a[href]')) return;   // ключ задачи — ссылка в Jira
    var more = e.target.closest('[data-blk-more]');
    if (more) { blkState.open[more.dataset.blkMore] = true; renderBlockers(); return; }
    var who = e.target.closest('[data-blk-who]');
    if (who) { blkState.who = who.dataset.blkWho && who.dataset.blkWho !== blkState.who ? who.dataset.blkWho : null; renderBlockers(); return; }
    var ep = e.target.closest('[data-blk-epic]');
    if (ep) { if (ep.dataset.blkEpic) openPanels(ep.dataset.blkEpic); return; }
    var row = e.target.closest('.blk-row[data-ctx]');
    if (row && ctxTargets[row.dataset.ctx]) {
      var r = row.getBoundingClientRect();
      openCommentPopup(ctxTargets[row.dataset.ctx], r.left + 12, r.bottom + 4);
    }
  });

  // ------------------------- меню бургера (вместо шапки) -------------------------
  // Шапка (.hero, кнопки корзины) скрыта стилем has-burger; пункты меню нажимают её кнопки.
  // Команда — через скрытую вкладку .team-tab: оболочка виджета слушает именно её.
  burger.label = function () { return team.team + (team.sprintName ? ' · ' + team.sprintName : ''); };
  burger.build = function () {
    var m = outputModel(team);
    var people = m ? m.rows.filter(function (r) { return r.name !== NOBODY; }).length : 0;
    var it = interpretation(), n = +document.getElementById('cCount').textContent || 0;
    var teams = TEAMS.length > 1 ? bmSection('Команда', '<div class="bm-teams">' + TEAMS.map(function (t) {
      return '<button type="button" class="bm-team' + (t.slug === team.slug ? ' on' : '') + '" data-bm-team="' + esc(t.slug) + '">' + esc(t.team) + '</button>';
    }).join('') + '</div>') : '';
    var board = team.boardUrl ? '<a class="bm-item" href="' + esc(team.boardUrl) + '" target="_blank" rel="noopener"><span class="bm-main">' +
      '<span class="bm-label">Доска</span><span class="bm-sub">' + esc(team.boardName || 'JIRA') + '</span></span><span class="bm-go">↗</span></a>' : '';
    return teams +
      bmSection(/^спринт/i.test(team.sprintName || '') ? team.sprintName : 'Спринт' + (team.sprintName ? ' ' + team.sprintName : ''),
        bmItem('data-bm-click="teamLink"', 'Команда', m ? people + ' ' + plural(people, 'участник', 'участника', 'участников') + ' · выработка за 3 спринта' : 'нет данных') +
        board +
        bmItem('data-bm-click="metricsLink"', 'Lead Time за 3 спринта', document.getElementById('metricsLink').textContent + ' · среднее / медиана / кол-во · сводный отчёт') +
        bmItem('data-bm-click="interpBtn"', 'Интерпретация ИИ', !it ? 'по этому сбору нет' : team.insights.stale ? 'написана по прошлому сбору' : 'динамика команды, на что обратить внимание, рекомендации')) +
      bmSection('Действия',
        bmItem('data-bm-click="notesToggle"', 'Комментарии', n ? n + ' ' + plural(n, 'заметка', 'заметки', 'заметок') + ' · промт для ИИ' : 'заметки к спринту и промт для ИИ',
          n ? '<span class="bm-n">' + n + '</span>' : null) +
        bmItem('data-bm-click="logsBtn"', 'Logs', 'кто что менял за спринт') +
        bmItem('data-bm-click="bizBtn"', 'Бизнес-отчёт', 'промт для презентации «ФАКТ | спринт»'));
  };
  if (burgerBtn) document.getElementById('burgerBody').addEventListener('click', function (e) {
    var b = e.target.closest('[data-bm-team]');
    if (!b) return;
    var tab = document.querySelector('#teamSwitch .team-tab[data-team="' + b.dataset.bmTeam + '"]');
    if (tab) tab.click();
    renderBurger();
  });

  function switchTeam(slug) {
    closePanels();
    useTeam(slug);
    migrateNotes();
    fillRefList();
    renderHero();
    blkState = { who: null, open: {} };
    renderSummary();
    renderBlockers();
    renderTable();
    renderMetricsLink();
    refreshBurger();
  }

  useTeam(TEAMS[0].slug);
  migrateNotes();
  fillRefList();
  renderHero();
  renderSummary();
  renderBlockers();
  renderTable();
  renderMetricsLink();
  refreshBurger();
  document.getElementById('logsBtn').addEventListener('click', openLogs);
  document.getElementById('metricsLink').addEventListener('click', function (e) {
    e.preventDefault();
    openMetrics();
  });
  document.getElementById('interpBtn').addEventListener('click', openInterpretation);
  document.getElementById('teamLink').addEventListener('click', function (e) {
    e.preventDefault();
    openTeam();
  });

  // «Бизнес-отчёт»: промт на колоду «ФАКТ | спринт» — тем же данным, своим навыком
  function businessPrompt() {
    var notes = allNotesLines();
    return [
      'Собери бизнес-отчёт «ФАКТ | спринт» для управляющего комитета, PO смежных департаментов и бизнес-заказчиков.',
      '',
      '/sprint-business',
      '',
      'Контекст:'
    ].concat(dataContext().map(function (l) { return '- ' + l; })).concat([
      '- Отчёт верхнеуровневый: слайд = цель OBJ, строка = KR (эпик) со сводкой историй спринта — итог одним предложением, блокер и следующий шаг; заблокированное — отдельно от не успетого по объёму.',
      '- Цели OBJ и KR — только из OKR/roadmap PO (.okr/<квартал>/OKR-*.md, roadmap.md) или со слов PO; источник — в goalsSource.',
      '- В конце каждой команды — операционный отчёт: производительность и выработка участников в SP.',
      '',
      notes.length ? 'Заметки PO из технического отчёта — учесть, если касаются бизнеса (риски, сдвиги, договорённости):' : 'Заметок PO в техническом отчёте нет.'
    ]).concat(notes).concat([
      '',
      'Выход: reports/sprint-business.html. Цифры — только из снимка, ключи задач — только из данных.'
    ]).join('\n');
  }
  document.getElementById('bizBtn').addEventListener('click', function () {
    openGenPrompt('Промт: бизнес-отчёт', 'Скопируйте и отправьте агенту — он соберёт «ФАКТ | спринт» навыком /sprint-business на тех же данных.', businessPrompt());
  });
</script>

</body>
</html>
