<title>Отчёт по спринтам команд</title>
<style>
  :root {
    --fg: #111;
    --bg: #fff;
    --muted: #666;
    --line: #ddd;
    --accent: #111;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--fg);
    background: var(--bg);
    line-height: 1.5;
  }
  .hero {
    padding: 48px 32px 32px;
    border-bottom: 3px solid var(--fg);
  }
  .hero .team {
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .hero h1 {
    margin: 0 0 12px;
    font-size: 32px;
    font-weight: 700;
  }
  .hero .meta {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    font-size: 14px;
    color: var(--muted);
  }
  .hero .meta strong { color: var(--fg); }
  .team-switch { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .team-tab {
    font: inherit; font-size: 13px; padding: 5px 14px;
    border: 1px solid var(--line); background: var(--bg); color: var(--muted);
    border-radius: 4px; cursor: pointer;
  }
  .team-tab:hover { border-color: var(--fg); color: var(--fg); }
  .team-tab.active { background: var(--fg); border-color: var(--fg); color: var(--bg); font-weight: 600; }

  .hero .board-link { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--line); }
  .hero .board-link:hover { border-bottom-color: var(--fg); }
  .hero .metrics-link {
    color: var(--fg);
    text-decoration: none;
    border-bottom: 1px dashed var(--muted);
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .hero .metrics-link:hover { border-bottom-style: solid; border-bottom-color: var(--fg); }

  .logs-btn {
    font: inherit;
    font-size: 13px;
    padding: 6px 14px;
    border: 1px solid var(--fg);
    background: var(--bg);
    color: var(--fg);
    border-radius: 4px;
    cursor: pointer;
  }
  .logs-btn:hover { background: var(--fg); color: var(--bg); }

  /* лента изменений */
  .log-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; flex-shrink: 0; }
  .log-chip {
    font: inherit;
    font-size: 12px;
    padding: 3px 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--muted);
    border-radius: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .log-chip:hover { border-color: var(--fg); color: var(--fg); }
  .log-chip.active { background: var(--fg); border-color: var(--fg); color: var(--bg); }

  .log-day { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
             color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
  .log-day:first-child { margin-top: 0; }

  .log-item { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
  .log-item:last-child { border-bottom: none; }
  .log-who {
    flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
    background: #f1f2f4; color: var(--muted);
    font-size: 10px; font-weight: 600; letter-spacing: 0.03em;
    display: flex; align-items: center; justify-content: center;
  }
  .log-main { min-width: 0; flex: 1; }
  .log-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .log-author { font-weight: 600; }
  .log-time { flex-shrink: 0; font-size: 11px; color: var(--muted); }
  .log-move { margin: 2px 0 3px; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .log-move .arrow { color: var(--c-zero); }
  .log-issue { font-size: 12px; }
  .log-issue a { color: var(--muted); text-decoration: none; }
  .log-issue a:hover { color: var(--fg); text-decoration: underline; }
  .log-verb { color: var(--muted); font-size: 12px; }
  .log-quote {
    font-size: 12px;
    color: var(--fg);
    background: #fafafa;
    border-left: 2px solid var(--line);
    padding: 6px 9px;
    margin: 2px 0 4px;
    border-radius: 0 3px 3px 0;
  }
  .log-empty { color: var(--muted); font-size: 13px; padding: 8px 0; }

  /* сводный отчёт за 3 спринта */
  .metrics-section + .metrics-section { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
  /* «i» у заголовка графика: как читать (статично) */
  .info { position: relative; display: inline-flex; vertical-align: -3px; margin-left: 6px; color: var(--ico, #adb2b8); cursor: help; outline: none; }
  .info:hover, .info:focus { color: var(--fg); }
  .info-tip {
    position: absolute; left: -8px; top: calc(100% + 8px); z-index: 8; width: 420px; max-width: 70vw;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.14); padding: 12px 14px; max-height: 70vh; overflow-y: auto;
    font-size: 13px; line-height: 1.5; font-weight: 400; letter-spacing: normal; text-transform: none;
    opacity: 0; visibility: hidden; transition: opacity 0.12s ease;
  }
  .info:hover .info-tip, .info:focus .info-tip, .info:focus-within .info-tip { opacity: 1; visibility: visible; }
  .info.up .info-tip { top: auto; bottom: calc(100% + 8px); }
  .info-tip b { display: block; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
  .info-tip b + ul { margin-top: 0; }
  .info-tip ul { margin: 0 0 10px; padding-left: 16px; }
  .info-tip ul:last-child { margin-bottom: 0; }
  .info-tip li { margin: 2px 0; }
  .info-tip .stat { margin: 0 0 10px; color: var(--muted); }
  /* «Инсайды ИИ» — последний раздел сводного отчёта: наблюдения агента для PO */
  .ai-lead { margin: -6px 0 12px; font-size: 13px; color: var(--muted); }
  .ai-list { list-style: none; margin: 0; padding: 0; }
  .ai-item { padding: 12px 0; border-top: 1px solid #f0f0f0; }
  .ai-item:first-child { border-top: none; padding-top: 4px; }
  .ai-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.04em;
             text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .ai-meta .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .ai-item.lv-risk .dot { background: var(--c-blocked); }
  .ai-item.lv-risk .lvl { color: var(--c-blocked); }
  .ai-item.lv-warn .dot { background: var(--c-testing); }
  .ai-item.lv-warn .lvl { color: var(--c-testing); }
  .ai-item.lv-good .dot { background: var(--c-done); }
  .ai-item.lv-good .lvl { color: var(--c-done); }
  .ai-meta .about::before { content: "· "; }
  .ai-text { margin: 0; font-size: 14px; line-height: 1.5; }
  .ai-act { margin: 4px 0 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .ai-keys { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .ai-keys a { font-size: 12px; color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }
  .ai-keys a:hover { color: var(--fg); border-bottom-color: var(--fg); }
  .ai-by { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
  .ai-none { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .ai-none code { font: 12px "SF Mono", Menlo, Consolas, monospace; color: var(--fg); }
  /* «!» в шапке команды: интерпретация динамики команды ИИ-агентом */
  .hero .switch-row { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; }
  .hero .switch-row .team-switch { margin: 0; min-width: 0; }
  .team-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .team-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .team-legend .hint { margin-left: auto; }
  .team-tab-wrap { overflow-x: auto; }
  .interp-btn {
    width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%;
    border: 2px solid var(--fg); background: var(--fg); color: var(--bg);
    font-family: inherit; font-size: 16px; font-weight: 800; line-height: 1; cursor: pointer; padding: 0;
  }
  .interp-btn:hover { opacity: .8; }
  .interp-btn.empty { background: var(--bg); color: var(--muted); border-color: var(--line); }
  .interp-btn.stale { background: var(--bg); color: var(--fg); border-style: dashed; }
  .interp-sec { padding: 16px 0; border-top: 1px solid #f0f0f0; }
  .interp-sec:first-of-type { border-top: none; padding-top: 4px; }
  .interp-sec h3 { margin: 0 0 8px; font-size: 15px; }
  .interp-sec ul { margin: 0; padding-left: 18px; }
  .interp-sec li { font-size: 14px; line-height: 1.55; margin: 0 0 6px; }
  .interp-sec li a { color: inherit; border-bottom: 1px solid var(--line); text-decoration: none; }
  .interp-stale { margin: 0 0 12px; padding: 8px 12px; font-size: 13px; background: #fff8e6; border-left: 3px solid var(--c-testing); }
  .metrics-section h3 {
    margin: 0 0 12px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .m-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .m-table th, .m-table td {
    padding: 7px 10px;
    border-bottom: 1px solid #eee;
    text-align: right;
    font-variant-numeric: tabular-nums;
    vertical-align: middle;
  }
  .m-table th:first-child, .m-table td:first-child { text-align: left; }
  .m-table thead th {
    border-bottom: 1px solid var(--line);
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
  }
  .m-table tbody tr:last-child td { border-bottom: none; }
  .m-table .accent { font-weight: 700; }
  .m-muted { color: var(--muted); }

  /* полоса производительности спринта */
  .bar {
    display: block;
    height: 6px;
    width: 100%;
    min-width: 90px;
    background: #eee;
    border-radius: 3px;
    overflow: hidden;
  }
  .bar > i { display: block; height: 100%; background: var(--c-done); }
  td.bar-cell { width: 130px; }

  /* диаграмма управления: точки Lead Time по спринтам */
  .chart { width: 100%; height: 190px; display: block; }
  .chart-legend { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
  .chart-legend .swatch {
    display: inline-block; width: 18px; height: 0; vertical-align: middle;
    border-top: 2px solid var(--c-progress); margin-right: 5px;
  }
  .chart-legend .swatch.median { border-top-style: dashed; border-top-color: var(--c-done); }
  .chart-legend .swatch.ideal { border-top-color: #9ca3af; }
  .chart-legend .swatch.actual { border-top-color: var(--c-blocked); }
  .chart-legend .swatch.limit { border-top-color: var(--c-blocked); }
  .chart-legend .dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 2px;
    vertical-align: middle; margin-right: 4px;
  }

  /* список задач-выбросов под диаграммой управления */
  .outliers { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .outliers-head {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--c-blocked); font-weight: 600; margin-bottom: 8px;
  }
  /* три колонки фиксированной ширины: название | статус | дни — строки не плавают */
  .outlier-row {
    display: grid; grid-template-columns: minmax(0, 1fr) 92px 56px;
    column-gap: 12px; align-items: center;
    padding: 7px 0; font-size: 12px; line-height: 18px;
    border-bottom: 1px solid #f0f0f0;
  }
  .outlier-row:last-child { border-bottom: none; }
  .outlier-row a {
    color: var(--fg); text-decoration: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .outlier-row a:hover { text-decoration: underline; }
  .outlier-row .key { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
  .outlier-row .status {
    justify-self: start; max-width: 100%; box-sizing: border-box;
    font-size: 11px; line-height: 16px; padding: 0 7px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .outlier-row .age { justify-self: end; font-size: 12px; }

  main { padding: 32px; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td {
    text-align: left;
    padding: 12px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  thead th {
    border-bottom: 2px solid var(--fg);
    font-weight: 700;
    white-space: nowrap;
  }
  /* вся строка кликабельна — открывает панель эпика */
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #fafafa; }
  td.epic { font-weight: 600; }
  td.epic .no-epic { color: var(--muted); }

  /* цвета бакетов статусов */
  :root {
    --c-open: #6b7280;      /* серый  — открыто/бэклог */
    --c-blocked: #dc2626;   /* красный — заблокировано */
    --c-progress: #2563eb;  /* синий  — в работе */
    --c-testing: #ca8a04;   /* жёлтый — тестирование */
    --c-review: #ea580c;    /* оранжевый — ревью */
    --c-done: #16a34a;      /* зелёный — готово */
    --c-zero: #c9ccd1;      /* нули — приглушённые */
  }

  /* агрегированные счётчики: миниатюрный текст 2/0/0/0/1/3
     ВАЖНО: класс ячейки (td.tally) и класс внутреннего бокса (.tally-box) разные.
     Одинаковое имя делало td инлайн-блоком и ломало раскладку таблицы. */
  td.tally { white-space: nowrap; width: 1%; text-align: right; padding-right: 20px; }
  .tally-box {
    position: relative;
    display: inline-block;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    cursor: default;
  }
  .tally-box .n { font-weight: 600; }
  .tally-box .n.zero { color: var(--c-zero); font-weight: 400; }
  .tally-box .sep { color: var(--c-zero); margin: 0 1px; }
  .n.b-open { color: var(--c-open); }
  .n.b-blocked { color: var(--c-blocked); }
  .n.b-progress { color: var(--c-progress); }
  .n.b-testing { color: var(--c-testing); }
  .n.b-review { color: var(--c-review); }
  .n.b-done { color: var(--c-done); }

  /* подсказка при наведении на счётчик; якорь справа — счётчики стоят у правого края,
     при left:0 длинная подсказка уезжала за пределы экрана и обрезалась */
  .tally-box .tip {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    z-index: 5;
    background: #111;
    color: #fff;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: normal;
    line-height: 1.4;
    padding: 6px 10px;
    border-radius: 4px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease;
  }
  .tally-box:hover .tip { opacity: 1; }

  td.actions { white-space: nowrap; width: 1%; }
  .action-btn {
    font: inherit;
    font-size: 13px;
    padding: 5px 12px;
    border: 1px solid var(--fg);
    background: var(--bg);
    color: var(--fg);
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  .action-btn:hover { background: var(--fg); color: var(--bg); }
  .action-btn.has-note { border-color: #111; font-weight: 600; }
  .action-btn.has-note::after { content: " •"; }

  /* сайдбары: два независимых панеля, один стек едет целиком */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
    z-index: 10;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  /* единая панель: одна рамка, одна тень, одна кнопка закрытия.
     Внутри — две колонки (заметка + истории) без собственных теней. */
  .panel-stack {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: 860px;
    max-width: 100vw;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border-left: 1px solid var(--line);
    box-shadow: -8px 0 24px rgba(0,0,0,0.08);
    z-index: 11;
    transform: translateX(100%);
    transition: transform 0.2s ease;
    pointer-events: none;
  }
  .panel-stack.open { transform: translateX(0); pointer-events: auto; }
  /* закрытая панель стоит за правым краем: её тень иначе ложится полосой на страницу */
  .panel-stack:not(.open) { box-shadow: none; }

  .stack-head {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--line);
    position: relative;
    flex-shrink: 0;
  }
  .stack-head .eyebrow {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .stack-head h2 { margin: 0 0 6px; font-size: 17px; line-height: 1.35; padding-right: 32px; }
  .stack-head a { font-size: 13px; color: var(--muted); }
  /* ключ эпика — сам ссылка в JIRA: отдельной кнопки «Открыть в JIRA» нет */
  .stack-head .eyebrow a.key-link {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: inherit; color: inherit; text-decoration: none;
  }
  .stack-head .eyebrow a.key-link:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
  .stack-head .eyebrow a.key-link svg { flex-shrink: 0; }
  .stack-links { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  .scope-btn {
    font: inherit; font-size: 13px; padding: 3px 12px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--fg); background: var(--bg); color: var(--fg);
  }
  .scope-btn:hover, .scope-btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

  /* «Весь эпик»: сводка, затем «Осталось» по процессу и «Сделано» */
  .scope-sum { margin: 0 0 14px; }
  .scope-sum .big { font-size: 15px; font-weight: 600; }
  .scope-sum .sub { font-size: 12px; color: var(--muted); margin-left: 6px; }
  .scope-bar { display: flex; gap: 2px; height: 8px; margin-top: 8px; }
  .scope-bar i { display: block; height: 100%; border-radius: 2px; }
  .scope-sec { margin-top: 6px; }
  .scope-sec > .sec-head {
    position: sticky; top: -16px; z-index: 2; background: var(--bg);
    display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 10px 0 8px;
    border: none; border-bottom: 1px solid var(--line); cursor: pointer; font: inherit; text-align: left;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg); font-weight: 600;
  }
  .scope-sec > .sec-head .n { color: var(--muted); font-weight: 400; letter-spacing: 0; }
  .scope-sec > .sec-head .arr { margin-left: auto; color: var(--muted); font-size: 11px; transition: transform 0.15s ease; }
  .scope-sec.closed > .sec-head .arr { transform: rotate(-90deg); }
  .scope-sec.closed > .sec-body { display: none; }
  /* подгруппы «Осталось» по процессу — сворачиваются, как и разделы */
  .scope-group { margin-top: 6px; }
  .scope-group > .grp-head {
    display: flex; align-items: center; gap: 6px; width: 100%; padding: 8px 0 4px;
    border: none; background: none; cursor: pointer; font: inherit; text-align: left;
    font-size: 12px; color: var(--muted);
  }
  .scope-group > .grp-head:hover { color: var(--fg); }
  .scope-group .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .scope-group .arr { margin-left: 2px; font-size: 9px; color: var(--muted); transition: transform 0.15s ease; }
  .scope-group.closed .arr { transform: rotate(-90deg); }
  .scope-group.closed > .grp-body { display: none; }
  .chip-sprint { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .chip-sprint.now { color: var(--fg); font-weight: 600; }

  .sidebar-close {
    position: absolute;
    top: 18px;
    right: 20px;
    border: none;
    background: none;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    color: var(--muted);
  }
  .sidebar-close:hover { color: var(--fg); }

  .stack-body { display: flex; flex: 1; min-height: 0; }

  .pane {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 16px 24px 20px;
    overflow-y: auto;
  }
  #panelStories { flex: 1; }

  .pane-label:empty { display: none; }
  .pane-label {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    flex-shrink: 0;
  }

  .sidebar-body { display: flex; flex-direction: column; flex: 1; min-height: 0; }


  /* список историй эпика, с разворотом подзадач */
  .story-item { border-bottom: 1px solid #eee; }
  .story-item:last-child { border-bottom: none; }
  .story-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: baseline;
    padding: 10px 0;
    font-size: 13px;
  }
  .story-row .story-title-wrap, .sub-item .story-title-wrap { display: flex; align-items: baseline; gap: 6px; min-width: 0; flex: 1; }
  .story-row .meta-wrap, .sub-item .meta-wrap {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-shrink: 0;
  }

  /* возраст статуса: сколько дней статус не менялся */
  .age {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    min-width: 26px;
    text-align: right;
  }
  .age.stale { color: var(--c-blocked); font-weight: 600; }
  .age.done { color: var(--c-done); font-weight: 600; }
  .age.risk { color: var(--c-testing); font-weight: 600; }
  .outliers-head.risk { color: var(--c-testing); }

  /* инициалы исполнителя слева от задачи; полное имя — в подсказке */
  .who {
    position: relative;
    flex-shrink: 0;
    width: 30px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--muted);
    cursor: default;
  }
  .who.none { color: var(--c-zero); font-weight: 400; }
  /* нативный title показывается с задержкой в секунду — рисуем свою подсказку */
  .who .who-tip {
    position: absolute;
    left: 0;
    top: calc(100% + 4px);
    z-index: 6;
    background: #111;
    color: #fff;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: normal;
    padding: 5px 9px;
    border-radius: 4px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease;
  }
  .who:hover .who-tip { opacity: 1; }
  .sub-item .age { font-size: 10px; }
  .story-toggle {
    flex-shrink: 0;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 11px;
    color: var(--muted);
    padding: 0 4px 0 0;
    width: 14px;
    transform: rotate(0deg);
    transition: transform 0.15s ease;
  }
  .story-toggle.open { transform: rotate(90deg); }
  .story-toggle:disabled { visibility: hidden; }
  .story-row a { color: var(--fg); text-decoration: none; }
  .story-row a:hover { text-decoration: underline; }

  /* базовый бейдж статуса — общий для историй и подзадач */
  .status {
    flex-shrink: 0;
    padding: 2px 8px;
    border: 1px solid var(--line);
    border-radius: 3px;
    font-size: 11px;
    white-space: nowrap;
  }
  .sub-item .status { font-size: 10px; padding: 1px 6px; }
  .status.b-open { color: var(--c-open); border-color: var(--c-open); }
  .status.b-blocked { color: var(--c-blocked); border-color: var(--c-blocked); }
  .status.b-progress { color: var(--c-progress); border-color: var(--c-progress); }
  .status.b-testing { color: var(--c-testing); border-color: var(--c-testing); }
  .status.b-review { color: var(--c-review); border-color: var(--c-review); }
  .status.b-done { color: var(--c-done); border-color: var(--c-done); font-weight: 600; }

  .sub-list { display: none; padding: 0 0 10px 20px; }
  .sub-list.open { display: block; }
  .sub-item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: baseline;
    padding: 6px 0;
    font-size: 12px;
    border-top: 1px dashed #eee;
  }
  .sub-item:first-child { border-top: none; }
  .sub-item a { color: var(--muted); text-decoration: none; flex: 1; min-width: 0; }
  .sub-item a:hover { color: var(--fg); text-decoration: underline; }

  .sidebar-empty { color: var(--muted); font-size: 13px; padding: 4px 0; }

  /* Корзина заметок в правом верхнем углу — тот же приём, что на странице ревью
     БФТ (poh-bft-writer): кнопка «Комментарии (N)», под ней панель со списком
     заметок и готовым промтом для ИИ. */
  .promptbox {
    position: fixed; top: 20px; right: 24px; z-index: 9;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  }
  .pb-row { display: flex; gap: 8px; }
  .pb-toggle {
    font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 4px; cursor: pointer;
    background: var(--fg); color: var(--bg); border: 1px solid var(--fg);
  }
  .pb-toggle[aria-expanded="true"] { background: var(--bg); color: var(--fg); }
  .notes-panel {
    display: none; width: 380px; max-height: calc(100vh - 90px); overflow-y: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.12); padding: 12px;
  }
  .notes-panel.open { display: block; }

  /* Иконки и строки — как в панели poh-okr-plugin: контур 1.4px, кнопка 28×28,
     серая до наведения; строка подсвечивается мягким фоном. */
  :root { --hover-bg: rgba(38,49,72,.06); --ico: #adb2b8; }
  .ico {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 28px; height: 28px; border: none; background: transparent; border-radius: 8px;
    color: var(--ico); cursor: pointer; padding: 0;
  }
  .ico:hover { background: var(--hover-bg); color: var(--fg); }
  .ico.danger:hover { color: var(--c-blocked); }

  .ncompose textarea {
    display: block; width: 100%; min-height: 38px; max-height: 160px; resize: none;
    font: inherit; font-size: 14px; line-height: 1.45; color: var(--fg);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
  }
  .ncompose textarea:focus, .nref:focus { outline: none; border-color: var(--fg); }
  .nref {
    width: 100%; margin-top: 6px; font: inherit; font-size: 12px; color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px;
  }
  /* «К чему» появляется, когда заметку начали писать, и не прячется по потере
     фокуса: иначе список под ним прыгал бы и клик уходил мимо иконки */
  .ncompose .nref { display: none; }
  .ncompose.filled .nref { display: block; }

  .ncard { margin-top: 10px; border-radius: 12px; background: var(--hover-bg); overflow: hidden; }
  .ncard:empty { display: none; }
  .nclear { margin-left: auto; font: inherit; font-size: 12px; background: none; border: 1px solid var(--line); border-radius: 6px;
            padding: 4px 10px; color: #b91c1c; cursor: pointer; }
  .nclear:hover { border-color: #b91c1c; }
  .nclear:disabled { color: var(--c-zero); border-color: var(--line); cursor: default; }
  .nteam { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
           padding: 10px 12px 4px; }
  .nrow .nsprint { font-style: italic; }
  .nrow { display: flex; align-items: flex-start; gap: 6px; padding: 8px 6px 8px 12px; }
  .nrow + .nrow { box-shadow: inset 0 1px 0 rgba(0,0,0,.08); }
  .nrow:hover { background: var(--hover-bg); }
  .nrow .ntext { flex: 1; min-width: 0; padding-top: 3px; font-size: 14px; line-height: 1.45;
                 white-space: pre-wrap; word-break: break-word; }
  .nrow .nref-line { display: block; margin-top: 2px; font-size: 12px; color: var(--muted);
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nrow .nacts { display: flex; opacity: 0; transition: opacity 0.12s ease; }
  .nrow:hover .nacts, .nrow:focus-within .nacts { opacity: 1; }
  .nrow.editing { display: block; padding: 8px; background: var(--bg); }
  .nrow.editing textarea {
    display: block; width: 100%; min-height: 58px; resize: vertical; font: inherit; font-size: 14px;
    line-height: 1.45; border: 1px solid var(--fg); border-radius: 8px; padding: 6px 10px;
  }
  .nempty { margin: 10px 2px 2px; font-size: 13px; color: var(--muted); }

  .nfoot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .nfoot .copybtn {
    flex: 1; font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  .nfoot .copybtn:hover { background: var(--hover-bg); border-color: var(--fg); }
  .nfoot .copybtn:disabled { color: var(--c-zero); border-color: var(--line); background: var(--bg); cursor: default; }
  .prompt-view {
    display: none; width: 100%; min-height: 140px; margin-top: 8px; resize: vertical;
    font: 11px/1.5 "SF Mono", Menlo, Consolas, monospace; color: var(--muted);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  .prompt-view.open { display: block; }

  /* уже оставленное к этой сущности — в поле правого клика, те же строки */
  .pexisting { margin-bottom: 8px; border-radius: 10px; background: var(--hover-bg); overflow: hidden; }
  .pexisting .nrow { padding: 4px 4px 4px 10px; }
  .pexisting .ntext { font-size: 13px; color: var(--muted); }

  /* поле комментария по правому клику */
  .cpop {
    position: fixed; z-index: 20; width: 360px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.16); padding: 10px 12px 12px;
  }
  .cpop[hidden] { display: none; }
  .cpop-target { margin: 0 2px 8px; }
  .cpop-target .nref-line { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cpop textarea {
    width: 100%; min-height: 64px; resize: vertical; font: inherit; font-size: 14px; line-height: 1.45;
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; color: var(--fg);
  }
  .cpop textarea:focus { outline: none; border-color: var(--fg); }
  .cpop-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .cpop-actions .hint { flex: 1; font-size: 11px; color: var(--muted); }

  /* метка «есть комментарии» у эпика и задачи */
  .cmark { font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cmark::before { content: "● "; font-size: 9px; }
  [data-ctx] { cursor: context-menu; }
  tbody tr[data-ctx] { cursor: pointer; }

  /* приоритет: глиф фиксированной ширины, имя из JIRA — в подсказке.
     Ч/б: цвет на странице несёт только статус, приоритет — насыщенностью. */
  .prio {
    flex-shrink: 0; display: inline-block; width: 16px; text-align: center;
    font-size: 12px; font-weight: 700; color: var(--fg); cursor: default;
  }
  .prio.p-medium, .prio.p-low, .prio.p-lowest { color: var(--muted); font-weight: 400; }
  .prio.p-none { color: var(--c-zero); font-weight: 400; }
  td.epic .prio { margin-right: 6px; }

  @media (max-width: 900px) {
    .promptbox { position: static; padding: 12px 16px 0; }
    .notes-panel { width: 100%; }
  }

  /* ---------- телефон (iPhone 15 Pro — 393 px) и PWA с экрана «Домой» ----------
     viewport-fit=cover: страница под чёлкой и полоской «Домой», поэтому поля
     считаются от env(safe-area-inset-*). */
  html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  /* телефон боком: «остров» сбоку — поля не меньше безопасной зоны */
  .hero, main { padding-left: max(32px, env(safe-area-inset-left)); padding-right: max(32px, env(safe-area-inset-right)); }
  .promptbox { top: max(20px, env(safe-area-inset-top)); right: max(24px, env(safe-area-inset-right)); }
  @media (max-width: 640px) {
    .promptbox {
      padding: calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
    }
    .pb-row { width: 100%; justify-content: flex-end; }
    .logs-btn, .pb-toggle { padding: 8px 14px; }
    .notes-panel { max-height: 70vh; }

    .hero { padding: 14px max(16px, env(safe-area-inset-right)) 18px max(16px, env(safe-area-inset-left)); }
    .hero .team { font-size: 11px; margin-bottom: 4px; }
    .hero h1 { font-size: 26px; margin-bottom: 10px; }
    /* вкладки команд — в одну строку с прокруткой, а не столбиком */
    .team-switch {
      flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
      margin: 0 calc(-1 * max(16px, env(safe-area-inset-left))) 12px; padding: 0 max(16px, env(safe-area-inset-left));
    }
    .team-switch::-webkit-scrollbar { display: none; }
    .team-tab { flex-shrink: 0; padding: 7px 14px; }
    .hero .meta { gap: 2px 16px; font-size: 13px; }

    main { padding: 4px max(16px, env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    /* строка эпика — карточка: название во всю ширину, под ним счётчики и шеврон */
    #tableBody tr {
      display: grid; grid-template-columns: 1fr auto; align-items: center;
      padding: 12px 0; border-bottom: 1px solid var(--line);
    }
    #tableBody tr:active { background: var(--hover-bg); }
    #tableBody td { display: block; padding: 0; border: none; }
    #tableBody td.epic { grid-column: 1 / -1; font-size: 15px; line-height: 1.35; margin-bottom: 6px; }
    #tableBody td.tally { text-align: left; padding: 0 0 0 22px; }
    #tableBody td.tally .tip { display: none; }
    #tableBody .action-btn { border: none; padding: 0 2px 0 8px; font-size: 0; background: none; color: var(--muted); }
    #tableBody .action-btn::after { content: "›"; font-size: 22px; line-height: 1; }
    #tableBody .action-btn.has-note::before { content: "●"; font-size: 9px; color: var(--fg); vertical-align: 4px; margin-right: 6px; }

    /* панель — на весь экран, крестик ниже чёлки */
    .panel-stack { width: 100vw; border-left: none; }
    .stack-head { padding: calc(14px + env(safe-area-inset-top)) 16px 12px; }
    .stack-head h2 { font-size: 18px; padding-right: 40px; }
    .sidebar-close { top: calc(8px + env(safe-area-inset-top)); right: 6px; width: 44px; height: 44px; font-size: 26px; }
    .scope-btn { padding: 7px 14px; }
    .pane { padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); }
    .scope-sum .sub { display: block; margin: 2px 0 0; }

    /* задача: название во всю ширину, статус и возраст — второй строкой под ним */
    .story-row { flex-wrap: wrap; row-gap: 4px; padding: 11px 0; }
    .story-row .story-title-wrap { flex-basis: 100%; }
    .story-row .meta-wrap { padding-left: 78px; }
    .sub-item { flex-wrap: wrap; row-gap: 2px; }
    .sub-item .story-title-wrap { flex-basis: 100%; }
    .sub-item .meta-wrap { padding-left: 52px; }
    .story-toggle { width: 22px; height: 22px; padding: 0; }

    /* метрики: графики на ширину экрана, статус в строках выбросов — по содержимому */
    .outlier-row { grid-template-columns: minmax(0, 1fr) auto 52px; column-gap: 8px; }
    .outlier-row .status { max-width: 104px; }
    /* подсказка «i» — шторкой снизу, а не облаком у иконки */
    .info-tip, .info.up .info-tip {
      position: fixed; left: 8px; right: 8px; top: auto; bottom: calc(8px + env(safe-area-inset-bottom));
      width: auto; max-width: none; max-height: 72vh !important; border-radius: 14px;
      box-shadow: 0 -8px 40px rgba(0,0,0,0.22);
    }

    /* поле заметки — сверху: снизу его закрыла бы клавиатура */
    .cpop {
      left: 8px !important; right: 8px; top: calc(8px + env(safe-area-inset-top)) !important;
      width: auto; max-height: 60vh; overflow-y: auto;
    }
  }

  /* сенсорный экран: наведения нет — действия видны всегда, подсказки по тапу */
  @media (hover: none) {
    .nrow .nacts { opacity: 1; }
    .ico { width: 36px; height: 36px; }
    .info:hover .info-tip, .info:focus .info-tip, .info:focus-within .info-tip { opacity: 0; visibility: hidden; }
    .info.open .info-tip { opacity: 1; visibility: visible; }
    .info { padding: 6px; margin: -6px -6px -6px 0; }
    /* долгое нажатие — заметка: без системного меню и выделения текста */
    [data-ctx], [data-ctx] a { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    [data-ctx].pressing { background: var(--hover-bg); transition: background 0.3s ease; }
    /* iOS увеличивает страницу при фокусе на поле с шрифтом меньше 16px */
    textarea, input { font-size: 16px !important; }
  }
  .cpop .cpop-cancel {
    font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 4px;
    border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer;
  }

  /* кнопка-промт в шапке: «Бизнес-отчёт» у отчёта PO, «Для техлидов» у бизнес-отчёта */
  .pres-btn {
    font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--fg); background: var(--bg); color: var(--fg);
  }
  .pres-btn:hover { background: var(--fg); color: var(--bg); }

  /* окно промта для генерации второго отчёта */
  .genbox-wrap { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.28); display: flex;
                 align-items: center; justify-content: center; padding: 16px; }
  .genbox-wrap[hidden] { display: none; }
  .genbox { background: var(--bg); color: var(--fg); border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.25);
            width: min(760px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; padding: 18px 20px; }
  .genbox h3 { margin: 0 0 4px; font-size: 17px; }
  .genbox .gen-sub { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .genbox textarea { flex: 1; min-height: 280px; width: 100%; box-sizing: border-box; resize: vertical; font: 12.5px/1.5 "SF Mono", Menlo, Consolas, monospace;
                     border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; color: var(--fg); background: #fafafa; }
  .genbox .gen-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .genbox .gen-actions button { font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 4px; cursor: pointer;
                                border: 1px solid var(--fg); background: var(--bg); color: var(--fg); }
  .genbox .gen-actions .primary { background: var(--fg); color: var(--bg); }
  /* «Весь эпик»: когда будет выполнен и на чём прогноз — общий для отчёта PO и бизнес-отчёта */
  .eb { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px 10px; margin-bottom: 16px; }
  .eb-title { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .eb-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .eb-top .eb-title { margin: 0; }
  .eb-modes { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; gap: 2px; }
  .eb-mode { font: inherit; font-size: 12px; padding: 4px 12px; border: 0; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; }
  .eb-mode:hover { color: var(--fg); }
  .eb-mode.on { background: var(--fg); color: var(--bg); }
  .eb .chart { width: 100%; height: auto; display: block; }
  .eb-analysis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
  .ea-cell { padding: 0 12px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
  .ea-cell:first-child { border-left: 0; padding-left: 0; }
  .ea-label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .ea-cell b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .ea-cell b small { font-size: 12px; font-weight: 400; color: var(--muted); }
  .ea-cell { cursor: help; }
  .ea-cell.bad b { color: var(--c-blocked); } .ea-cell.warn b { color: var(--c-testing); } .ea-cell.ok b { color: var(--c-done); }
  .eb-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .eb-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .eb-legend .l-done { background: #cfe8c4; } .eb-legend .l-left { background: #6c9fd8; } .eb-legend .l-add { background: #3f6290; }
  .eb-legend .l-fc { background: #ececec; border: 1px solid #d4d4d4; } .eb-legend .l-due { width: 2px; height: 12px; background: #dc2626; border-radius: 0; }
  @media (max-width: 640px) { .eb-analysis { grid-template-columns: 1fr 1fr; gap: 10px 0; } .ea-cell:nth-child(odd) { border-left: 0; padding-left: 0; } }

  /* участники: таблица по спринтам, подсказка, сайдбар участника (отчёт PO — «Команда: N») */
  table.mtab { width: 100%; border-collapse: collapse; font-size: 12.5px; table-layout: fixed; }
  table.mtab th, table.mtab td { border: 1px solid #cfcfcf; padding: 10px 6px; text-align: center; }
  table.mtab th { background: #f3f3f3; font-weight: 700; font-size: 12px; }
  table.mtab th small { display: block; font-weight: 400; color: #888; font-size: 10.5px; }
  table.mtab td.who { text-align: left; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  table.mtab td.lead { font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.mtab tr.total td { background: #f7f7f7; font-weight: 600; }
  .deck-tip {
    position: fixed; z-index: 400; pointer-events: none; background: #fff; color: #111;
    border: 1px solid #ddd; box-shadow: 0 6px 20px rgba(0,0,0,.15); border-radius: 6px;
    padding: 10px 12px; font: 12px/1.5 Arial, sans-serif; min-width: 230px;
  }
  .deck-tip b { display: block; margin-bottom: 4px; }
  .deck-tip .tr { display: grid; grid-template-columns: 12px 1fr auto; gap: 6px; align-items: center; }
  .deck-tip .tr i { width: 9px; height: 9px; border-radius: 2px; }
  .deck-tip .tr span:last-child { font-variant-numeric: tabular-nums; color: #333; }
  .deck-tip .tr.zero { color: #aaa; }
  .deck-tip .sum { border-top: 1px solid #eee; margin-top: 5px; padding-top: 5px; color: #555; }
  table.mtab button.mname { font: inherit; font-weight: 600; background: none; border: 0; padding: 0; cursor: pointer; color: #111;
                            border-bottom: 1px dashed #999; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  table.mtab button.mname:hover { border-bottom-style: solid; }
  table.mtab td.mcell { cursor: help; padding: 5px 10px; }
  table.mtab td.who, table.mtab td.lead { padding: 5px 6px; }
  table.mtab td.mcell:hover { background: #fafafa; }
  .mc-top { display: flex; align-items: baseline; justify-content: center; gap: 5px; }
  .mc-top b { font-size: 17px; line-height: 1.15; color: var(--c-done); font-variant-numeric: tabular-nums; }
  .mc-top span { font-size: 11px; color: #888; }
  .mc-bar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: #eee; margin: 3px 0 2px; }
  .mc-bar i { display: block; height: 100%; }
  .mc-nums { font-size: 11px; font-variant-numeric: tabular-nums; }
  .mc-nums .sep { color: #ccc; margin: 0 4px; }
  .mc-nums .g-todo { color: var(--c-open); } .mc-nums .g-work { color: var(--c-progress); } .mc-nums .g-done { color: var(--c-done); font-weight: 700; }
  .mc-nums .z { color: var(--c-zero); font-weight: 400; }
  table.mtab .none { color: #bbb; }
  table.mtab.dense .mc-nums { display: none; }
  table.mtab.dense td.mcell { padding: 4px 10px; }
  .deck-tip .tg { margin-top: 6px; }
  .deck-tip .tr.head { font-weight: 700; }
  .deck-tip .tr.sub { padding-left: 4px; color: #444; }
  .deck-tip .tr.sub i { background: none; }

  /* сайдбар участника */
  .mi-group { margin-bottom: 14px; }
  .mi-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .mi-head i { width: 9px; height: 9px; border-radius: 2px; }
  .mi-head span { margin-left: auto; font-weight: 400; color: var(--muted); }
  .mi-row { display: grid; grid-template-columns: 86px 1fr auto 56px; gap: 10px; align-items: center; width: 100%; text-align: left;
            font: inherit; font-size: 13px; background: none; border: 0; border-bottom: 1px solid #f0f0f0; padding: 8px 2px; cursor: pointer; color: var(--fg); }
  .mi-row:hover { background: #f7f7f7; }
  .mi-key { color: var(--muted); font-size: 12px; }
  .mi-sp { text-align: right; font-variant-numeric: tabular-nums; color: #333; }
  .mi-empty { font-size: 12px; color: var(--muted); padding: 6px 2px; }
  .mi-row.open { background: #f7f7f7; }
  .mi-detail { padding: 4px 4px 12px 98px; border-bottom: 1px solid #f0f0f0; }
  .mi-act { list-style: none; margin: 0; padding: 0; }
  .mi-act li { display: grid; grid-template-columns: 82px 1fr 30px; gap: 8px; align-items: center; padding: 3px 0; font-size: 12.5px; }
  .mi-act .mi-when { color: var(--muted); font-variant-numeric: tabular-nums; }
  .mi-act .mi-what { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .mi-act .arrow { color: var(--c-zero); }
  .mi-act .mi-c { color: #333; font-style: italic; }
  .mi-act .mi-by { color: var(--muted); font-size: 11px; text-align: right; }
  .mi-act-empty { font-size: 12px; color: var(--muted); padding: 4px 0; }
  .mi-jira { display: inline-block; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .mi-back { font: inherit; font-size: 13px; background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; margin-bottom: 12px; }
  .mi-back:hover { color: var(--fg); }
  .mi-task { margin-bottom: 14px; }
  .mi-task .key-link { color: var(--muted); font-size: 13px; text-decoration: none; letter-spacing: .04em; }
  .mi-task .key-link:hover { color: var(--fg); }
  .mi-task-title { font-size: 16px; font-weight: 600; margin: 4px 0 8px; }
  .mi-task-meta { display: flex; gap: 10px; align-items: center; font-size: 13px; }

  /* ---------- ✋ Блокаторы (отчёт PO): первым разделом, до эпиков ---------- */
  .blockers { margin: 0 0 36px; }
  .blk-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .blk-head h2 { margin: 0; font-size: 20px; }
  .blk-head h2 .n, .blk-group h3 .n { color: var(--c-blocked); margin-left: 8px; font-variant-numeric: tabular-nums; }
  .blk-head small { color: var(--muted); font-size: 12px; }
  .blk-reset { font: inherit; font-size: 12px; border: 1px solid var(--fg); background: var(--fg); color: var(--bg);
    border-radius: 12px; padding: 1px 10px; cursor: pointer; }
  .blk-empty { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
  .blk-groups { columns: 2 420px; column-gap: 40px; }
  .blk-group { break-inside: avoid; margin-top: 14px; }
  .blk-group h3 { margin: 0 0 2px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .blk-group h3 .n { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .blk-group ul { list-style: none; margin: 0; padding: 0; }
  .blk-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .blk-row:hover, .blk-row.pressing { background: var(--hover-bg); }
  .blk-main { flex: 1; min-width: 0; }
  .blk-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk-sub { font-size: 12px; color: var(--muted); }
  .blk-key { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }
  .blk-key:hover { color: var(--fg); }
  .blk-cm .cmark { margin-left: 8px; }
  .blk-days { color: var(--c-blocked); font-size: 14px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .blk-row.stale .blk-days { font-weight: 400; }
  .blk-more { font: inherit; font-size: 12px; color: var(--muted); background: none; border: none; padding: 6px 0; cursor: pointer; }
  .blk-more:hover { color: var(--fg); }
  .blk-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px 40px; margin-top: 20px; }
  .blk-bars h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .blk-bar { display: grid; grid-template-columns: minmax(0, 11em) 1fr 2.5em; align-items: center; gap: 10px; width: 100%;
    font: inherit; font-size: 13px; text-align: left; background: none; border: none; padding: 4px 0; cursor: pointer; color: var(--fg); }
  .blk-bar-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk-bar-track { height: 6px; border-radius: 3px; background: var(--hover-bg); overflow: hidden; }
  .blk-bar-track span { display: block; height: 100%; background: var(--c-blocked); opacity: .75; border-radius: 3px; }
  .blk-bar-n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .blk-bar:hover .blk-bar-label, .blk-bar.on .blk-bar-label { text-decoration: underline; }
  .blk-bar.on .blk-bar-track span { opacity: 1; }
  @media (max-width: 640px) {
    .blockers { margin-bottom: 24px; }
    .blk-groups { columns: 1; }
    .blk-row { padding: 11px 0; }
    .blk-title { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.35; }
    .blk-bar { grid-template-columns: minmax(0, 9em) 1fr 2.2em; padding: 6px 0; }
  }

  /* ---------- бургер вместо шапки (shared/burger.html): «☰ команда · спринт» и меню ---------- */
  .has-burger .hero, .has-burger .promptbox .pb-row { display: none; }
  .has-burger main { padding-top: calc(68px + env(safe-area-inset-top)); }
  .burger {
    position: fixed; z-index: 9; top: max(14px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left));
    display: inline-flex; align-items: center; gap: 10px; height: 40px; max-width: calc(100vw - 32px);
    padding: 0 14px 0 13px; border: 1px solid var(--line); border-radius: 20px;
    background: rgba(255,255,255,.94); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: 0 2px 10px rgba(0,0,0,.08); font: inherit; font-size: 14px; font-weight: 600; color: var(--fg); cursor: pointer;
  }
  .burger:hover { border-color: var(--fg); }
  .burger-ico { display: inline-flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
  .burger-ico i { display: block; width: 16px; height: 2px; border-radius: 1px; background: var(--fg); }
  .burger-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .burger-badge, .bm-n {
    flex-shrink: 0; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
    background: var(--fg); color: var(--bg); font-size: 12px; font-weight: 600; line-height: 20px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .burger-scrim { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.25); }
  .burger-menu {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 61; width: min(380px, 100vw);
    display: flex; flex-direction: column; background: var(--bg); box-shadow: 4px 0 24px rgba(0,0,0,.15);
    padding: env(safe-area-inset-top) 0 0 env(safe-area-inset-left);
  }
  .burger-menu[hidden], .burger-scrim[hidden] { display: none; }
  .bm-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 10px 10px 20px; border-bottom: 1px solid var(--line); }
  .bm-head b { font-size: 17px; }
  .bm-close { width: 44px; height: 44px; border: none; background: none; font-size: 20px; color: var(--muted); cursor: pointer; border-radius: 22px; }
  .bm-close:hover { background: var(--hover-bg); color: var(--fg); }
  .bm-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 0 calc(24px + env(safe-area-inset-bottom)); }
  .bm-sec { padding: 14px 20px 2px; }

    var id = classifyBucket(status, category);
    for (var i = 0; i < BUCKETS.length; i++) {
      if (BUCKETS[i].id === id) return BUCKETS[i].cls;
    }
    return 'b-open';
  }

  // Агрегация по ВСЕЙ иерархии эпика: каждая история + каждая её подзадача = 1 единица.
  function tallyEpic(epic) {
    var counts = {};
    BUCKETS.forEach(function (b) { counts[b.id] = 0; });

    (epic.stories || []).forEach(function (story) {
      counts[classifyBucket(story.status, story.category)]++;
      (story.subtasks || []).forEach(function (sub) {
        counts[classifyBucket(sub.status, sub.category)]++;
      });
    });

    counts.total = BUCKETS.reduce(function (acc, b) { return acc + counts[b.id]; }, 0);
    return counts;
  }

  function jiraUrl(key) { return JIRA_BASE + '/browse/' + key; }

  // Сколько дней статус не менялся. Считается в браузере от текущей даты,
  // поэтому страница не «протухает»: в данных лежит ISO-дата последней смены статуса.
  // Больше STALE_DAYS дней без движения — подсвечиваем красным.
  var STALE_DAYS = 3;

  // Момент из данных → Date. JIRA пишет пояс без двоеточия («+0300»): V8 такое понимает,
  // Safari (iPhone, PWA) — нет, поэтому двоеточие вставляем сами.
  function parseTs(iso) {
    return new Date(String(iso).replace(/([+-]\d{2})(\d{2})$/, '$1:$2'));
  }

  function statusAge(iso) {
    if (!iso) return null;
    var then = parseTs(iso);
    if (isNaN(then.getTime())) return null;
    var days = Math.floor((Date.now() - then.getTime()) / 86400000);
    if (days < 0) days = 0;
    return days;
  }

  // Готовые задачи по определению стоят без движения — красить их «просрочкой» смысла нет,
  // поэтому для бакета done возраст всегда зелёный и никогда не stale.
  function ageHtml(iso, status, category) {
    var isDone = classifyBucket(status, category) === 'done';
    var days = statusAge(iso);
    if (days === null) {
      return '<span class="age' + (isDone ? ' done' : '') + '" title="Дата смены статуса неизвестна">—</span>';
    }
    var label = days + 'д';
    var title = isDone
      ? 'Закрыто ' + (days === 0 ? 'сегодня' : days + ' дн. назад')
      : (days === 0 ? 'Статус изменён сегодня' : 'Статус не менялся ' + days + ' дн.');
    var cls = isDone ? ' done' : (days > STALE_DAYS ? ' stale' : '');
    return '<span class="age' + cls + '" title="' + esc(title) + '">' + label + '</span>';
  }

  // Инициалы исполнителя: "Фамилия Имя Отчество" -> "ФИ" (фамилия + имя).
  // Полное имя показывается подсказкой при наведении.
  function whoHtml(name) {
    if (!name) {
      return '<span class="who none">—<span class="who-tip">Исполнитель не назначен</span></span>';
    }
    var parts = String(name).trim().split(/\s+/);
    var initials = parts.slice(0, 2).map(function (p) { return p.charAt(0).toUpperCase(); }).join('');
    // В подсказке переставляем «Фамилия Имя Отчество» в «Имя Фамилия».
    // Но если вторая часть — одна буква (инициал или метка вида «Участник А»),
    // переставлять нечего: получится «А Участник».
    var full = (parts.length >= 2 && parts[1].replace('.', '').length > 1)
      ? parts[1] + ' ' + parts[0]
      : name;
    return '<span class="who" title="' + esc(name) + '">' + esc(initials) +
      '<span class="who-tip">' + esc(full) + '</span></span>';
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
  }

  var overlay = document.getElementById('overlay');
  var panelStack = document.getElementById('panelStack');
  var stackKey = document.getElementById('stackKey');
  var stackTitle = document.getElementById('stackTitle');
  var storiesLabel = document.getElementById('storiesLabel');
  var storiesBody = document.getElementById('storiesBody');

  // ------------------------- заметки (корзина) -------------------------
  // Как на странице ревью БФТ: заметки копятся в корзине справа вверху, каждую
  // можно поправить или удалить, наружу они уходят готовым промтом для ИИ.
  // У заметки необязательная привязка к сущности (эпик, история, подзадача или
  // любой ключ вне отчёта) — чтобы LLM сразу понимала, о чём речь.
  // Хранение — браузер, своя корзина у каждой команды. Комментарий не пропадает,
  // пока PO не удалит его сам:
  //   • ключ без имени спринта — смена спринта или версии файла корзину не обнуляет
  //     (спринт записан в самом комментарии); корзины старого формата
  //     «…:comments:<спринт>» один раз вливаются и не удаляются;
  //   • битая запись не затирается: сырое значение уходит в «…:corrupt:<время>»;
  //   • перед каждой записью прошлое значение — в «…:backup»;
  //   • копия в IndexedDB: localStorage очищен — корзина восстанавливается из неё;
  //   • navigator.storage.persist() — просим браузер не вытеснять хранилище.
  function commentsKey() { return 'actual-sprint:' + REPORT_ID + ':comments'; }

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

  function parseList(raw) {
    if (raw === null || raw === undefined || raw === '') return [];
    var list = JSON.parse(raw);                       // бросает на битой записи
    if (!Array.isArray(list)) throw new Error('не список');
    return list;
  }

  function legacyKeys(key) {
    var out = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(key + ':') === 0 && !/:(backup|corrupt|merged)/.test(k.slice(key.length))) out.push(k);
      }
    } catch (e) { /* без хранилища — нечего вливать */ }
    return out.sort();
  }

  function loadComments() {
    var key = commentsKey(), list;
    var raw = lsGet(key);
    try { list = parseList(raw); }
    catch (e) {
      // битую запись не выбрасываем: откладываем как есть и идём дальше с копии
      lsSet(key + ':corrupt:' + Date.now(), raw);
      try { list = parseList(lsGet(key + ':backup')); } catch (e2) { list = []; }
      lsSet(key, JSON.stringify(list));
    }
    // корзины прошлых спринтов (старый формат ключа) — один раз влить, не удаляя
    var legacy = legacyKeys(key).filter(function (k) { return !lsGet(key + ':merged:' + k.slice(key.length + 1)); });
    if (legacy.length) {
      var seen = {};
      list.forEach(function (c) { seen[c.id] = true; });
      legacy.forEach(function (k) {
        var sprint = k.slice(key.length + 1), old;
        try { old = parseList(lsGet(k)); } catch (e) { old = []; }
        old.forEach(function (c) {
          if (c && c.id && !seen[c.id]) { seen[c.id] = true; list.push(Object.assign({ sprint: sprint }, c)); }
        });
        lsSet(key + ':merged:' + sprint, '1');
      });
      list.sort(function (a, b) { return (a.at || '') < (b.at || '') ? -1 : 1; });
      writeComments(list);
    }
    return list;
  }

  function writeComments(list) {
    var key = commentsKey(), prev = lsGet(key), text = JSON.stringify(list);
    if (prev && prev !== text) lsSet(key + ':backup', prev);
    lsSet(key, text);
    idbPut(key, text);
  }

  function saveComments(list) { writeComments(list); }

  // --- копия корзины в IndexedDB: переживает очистку localStorage
  var IDB_NAME = 'actual-sprint-comments';
  function idbOpen(fn) {
    try {
      if (!window.indexedDB) return;
      var req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore('kv'); };
      req.onsuccess = function () { fn(req.result); };
    } catch (e) { /* приватный режим — живём без копии */ }
  }
  function idbPut(key, text) {
    idbOpen(function (db) {
      try { db.transaction('kv', 'readwrite').objectStore('kv').put({ text: text, at: Date.now() }, key); } catch (e) {}
    });
  }
  // при старте: у команды пусто в localStorage, а в IndexedDB есть корзина — вернуть
  function restoreComments(done) {
    idbOpen(function (db) {
      var slugs = TEAMS.map(function (t) { return t.slug; }), left = slugs.length, restored = false;
      slugs.forEach(function (slug) {
        var key = 'actual-sprint:' + slug + ':comments';
        try {
          var get = db.transaction('kv', 'readonly').objectStore('kv').get(key);
          get.onsuccess = function () {
            var rec = get.result, cur = lsGet(key);
            if (rec && rec.text && rec.text !== '[]' && (cur === null || cur === '[]')) { lsSet(key, rec.text); restored = true; }
            else if (cur && (!rec || rec.text !== cur)) idbPut(key, cur);   // копия отстала — догнать
            if (--left === 0 && done) done(restored);
          };
          get.onerror = function () { if (--left === 0 && done) done(restored); };
        } catch (e) { if (--left === 0 && done) done(restored); }
      });
    });
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function addComment(target, text) {
    text = String(text || '').trim();
    if (!text) return false;
    var list = loadComments();
    list.push({ id: newId(), at: new Date().toISOString(), sprint: team.sprintName, target: target, text: text });
    saveComments(list);
    refreshComments();
    return true;
  }

  function updateComment(id, text, target) {
    text = String(text || '').trim();
    if (!text) return false;
    saveComments(loadComments().map(function (c) {
      return c.id === id ? Object.assign({}, c, { text: text, target: target, editedAt: new Date().toISOString() }) : c;
    }));
    refreshComments();
    return true;
  }

  function removeComment(id) {
    saveComments(loadComments().filter(function (c) { return c.id !== id; }));
    refreshComments();
  }

  // Заметки прошлых версий страницы (textarea в панели и файл sprint-report-notes.json)
  // один раз переезжают в корзину, чтобы ничего не потерялось. Старые ключи не трогаем.
  function migrateNotes() {
    var flag = 'actual-sprint:' + REPORT_ID + ':notes-migrated';
    if (localStorage.getItem(flag)) return;
    var prefix = 'actual-sprint:' + REPORT_ID + ':note:';
    var bag = {};
    Object.keys(team.notes || {}).forEach(function (k) { bag[k] = team.notes[k]; });
    Object.keys(localStorage).forEach(function (k) {
      if (k.indexOf(prefix) === 0 && localStorage.getItem(k)) bag[k.slice(prefix.length)] = localStorage.getItem(k);
    });
    var list = loadComments();
    Object.keys(bag).forEach(function (rowId) {
      var text = String(bag[rowId] || '').trim();
      if (!text) return;
      var epic = EPICS.find(function (e) { return e.rowId === rowId; });
      var target = epic ? epicTarget(epic)
        : { kind: 'general', title: rowId === '__metrics__' ? 'Сводный отчёт' : rowId === '__logs__' ? 'Лента изменений' : '' };
      list.push({ id: 'm-' + rowId, at: new Date().toISOString(), target: target, text: text, migrated: true });
    });
    saveComments(list);
    localStorage.setItem(flag, '1');
  }

  // --- к чему заметка: снимок сущности на момент записи, чтобы промт читался
  //     и тогда, когда данные отчёта уже пересобраны
  function epicTarget(epic) {
    return { kind: 'epic', key: epic.epicKey, title: epic.epicTitle || 'Без эпика',
             rowId: epic.rowId, priority: epic.epicPriority || null };
  }

  function itemTarget(kind, item, epic) {
    return { kind: kind, key: item.key, title: item.title || item.summary, status: item.status,
             priority: item.priority || null, assignee: item.assignee || null,
             epicKey: epic.epicKey, epicTitle: epic.epicTitle, rowId: epic.rowId };
  }

  var GENERAL = { kind: 'general' };
  var KIND_NAME = { epic: 'Эпик', story: 'История', subtask: 'Подзадача', event: 'Задача',
                    ref: 'Вне отчёта', chart: 'График', insight: 'Инсайд ИИ', slide: 'Слайд презентации',
                    blocker: 'Блокатор' };

  // все сущности текущей команды по ключу: для привязки из корзины и подсказок
  function entityIndex() {
    var idx = {};
    EPICS.forEach(function (e) {
      if (e.epicKey) idx[e.epicKey.toUpperCase()] = epicTarget(e);
      (e.stories || []).forEach(function (st) {
        idx[st.key.toUpperCase()] = itemTarget('story', st, e);
        (st.subtasks || []).forEach(function (sub) { idx[sub.key.toUpperCase()] = itemTarget('subtask', sub, e); });
      });
    });
    return idx;
  }

  function fillRefList() {
    var idx = entityIndex();
    document.getElementById('refList').innerHTML = Object.keys(idx).map(function (k) {
      var t = idx[k];
      return '<option value="' + esc(t.key) + '">' + esc(KIND_NAME[t.kind] + ' · ' + t.title) + '</option>';
    }).join('');
  }

  // «INIT-132» или «INIT-132 — что угодно» → снимок сущности; ключ не из отчёта
  // (история вне спринта) тоже годится; пусто → заметка без привязки
  function resolveRef(value) {
    value = String(value || '').trim();
    if (!value) return GENERAL;
    var m = value.match(/^[A-Za-zА-Яа-яЁё][\wЀ-ӿ]*-\d+/);
    var key = m ? m[0].toUpperCase() : null;
    var known = key ? entityIndex()[key] : null;
    if (known) return known;
    return { kind: 'ref', key: key || value, title: key ? value.slice(m[0].length).replace(/^[\s—–-]+/, '') : '' };
  }

  function refValue(t) { return t && t.kind !== 'general' && t.key ? t.key : ''; }

  // одна строка «к чему»: и для корзины, и для промта
  function targetLine(t) {
    if (!t || t.kind === 'general') return 'без привязки' + (t && t.title ? ' · ' + t.title : '');
    var head = KIND_NAME[t.kind] + (t.key ? ' ' + t.key : '') + (t.title ? ' «' + t.title + '»' : '');
    var parts = [head];
    if ((t.kind === 'story' || t.kind === 'subtask' || t.kind === 'blocker') && t.epicTitle) {
      parts.push('эпик ' + (t.epicKey ? t.epicKey + ' ' : '') + '«' + t.epicTitle + '»');
    }
    if (t.priority) parts.push('приоритет ' + t.priority);
    if (t.status) parts.push('статус ' + t.status);
    if (t.assignee) parts.push('исполнитель ' + t.assignee);
    // блокатор: агенту сразу видно, что задача стоит и сколько (раздел «✋ Блокаторы»)
    if (t.kind === 'blocker') parts.push('стоит: ' + (t.why === 'stale' ? 'без движения' : 'в ожидании') +
      (t.days != null ? ' ' + t.days + ' раб. ' + plural(t.days, 'день', 'дня', 'дней') : ''));
    return parts.join(' · ');
  }

  function stamp(iso, withYear) {
    var d = parseTs(iso);
    var two = function (n) { return ('0' + n).slice(-2); };
    return two(d.getDate()) + '.' + two(d.getMonth() + 1) + (withYear ? '.' + d.getFullYear() : '') +
      ' ' + two(d.getHours()) + ':' + two(d.getMinutes());
  }

  // Промт для ИИ: контекст отчёта, формат строки и заметки по порядку.
  // В квадратных скобках — к чему заметка; по ним LLM сразу находит сущность.
  function buildPrompt(list) {
    if (!list.length) return '';
    var when = team._meta && team._meta.collectedAt ? ' · данные JIRA на ' + stamp(team._meta.collectedAt, true) : '';
    var out = ['Заметки PO к отчёту спринта — учти их при разборе спринта и в ответах.',
               'Команда «' + team.team + '» · ' + team.sprintName + ' · доска «' + team.boardName + '»' + when + '.',
               'Формат: номер. [к чему относится] текст заметки. [без привязки] — заметка о процессе в целом.', ''];
    list.forEach(function (c, i) {
      var lines = String(c.text).split('\n');
      out.push((i + 1) + '. [' + targetLine(c.target) + '] ' + lines[0]);
      lines.slice(1).forEach(function (line) { out.push('   ' + line); });
    });
    return out.join('\n');
  }

  function copyText(text) {
    // file:// и старые браузеры без Clipboard API — через скрытое поле
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return ok ? Promise.resolve() : Promise.reject(new Error('copy'));
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(fallback);
    }
    return fallback();
  }

  // --- иконки: контур 1.4px в сетке 16×16, как в панели poh-okr-plugin
  var ICON = {
    pencil: 'M10.4 3.4l2.2 2.2-6.9 6.9-2.9.7.7-2.9zM9.2 4.6l2.2 2.2',
    trash: 'M3.4 4.6h9.2M6.4 4.6V3.4h3.2v1.2M5 4.6l.6 8.2h4.8l.6-8.2',
    eye: 'M1.8 8s2.3-4.2 6.2-4.2S14.2 8 14.2 8s-2.3 4.2-6.2 4.2S1.8 8 1.8 8zM8 6.3a1.7 1.7 0 1 0 0 3.4 1.7 1.7 0 0 0 0-3.4'
  };
  function svgIcon(name) {
    return '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"' +
      ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + ICON[name] + '"/></svg>';
  }
  function icoBtn(name, title, attr, cls) {
    return '<button class="ico' + (cls ? ' ' + cls : '') + '" type="button" ' + attr +
      ' title="' + title + '" aria-label="' + title + '">' + svgIcon(name) + '</button>';
  }

  // --- корзина
  var notesPanel = document.getElementById('notesPanel');
  var notesToggle = document.getElementById('notesToggle');
  var editingId = null;

  // подпись под заметкой: только если привязана — «INIT-132 · Сервис приёма событий»
  function refLineHtml(t) {
    if (!t || t.kind === 'general') return '';
    var text = (t.key ? t.key : KIND_NAME[t.kind]) + (t.title ? ' · ' + t.title : '');
    return '<span class="nref-line" title="' + esc(targetLine(t)) + '">' + esc(text) + '</span>';
  }

  // корзина показывает все команды: заметку правим и удаляем в её команде
  function inTeam(slug, fn) {
    var prev = team.slug;
    if (slug && slug !== prev) useTeam(slug);
    try { return fn(); } finally { if (team.slug !== prev) useTeam(prev); }
  }

  function noteItemHtml(c, slug, sprintNow) {
    var dt = ' data-team="' + esc(slug || team.slug) + '"';
    if (c.id === editingId) {
      return '<div class="nrow editing" data-id="' + esc(c.id) + '"' + dt + '>' +
        '<textarea class="nedit-text" title="Enter — сохранить, Esc — отмена">' + esc(c.text) + '</textarea>' +
        '<input class="nref nedit-ref" list="refList" autocomplete="off" value="' + esc(refValue(c.target)) + '"' +
        ' placeholder="К чему — ключ эпика или задачи, необязательно"></div>';
    }
    var tip = 'Добавлено ' + stamp(c.at, true) + (c.editedAt ? ', изменено ' + stamp(c.editedAt, true) : '') +
      (c.migrated ? ' · перенесено из заметки' : '') + (c.sprint ? ' · спринт ' + c.sprint : '');
    var past = c.sprint && sprintNow && c.sprint !== sprintNow ? '<span class="nref-line nsprint">спринт ' + esc(c.sprint) + '</span>' : '';
    return '<div class="nrow" data-id="' + esc(c.id) + '"' + dt + ' title="' + esc(tip) + '">' +
      '<div class="ntext">' + esc(c.text) + refLineHtml(c.target) + past + '</div>' +
      '<div class="nacts">' + icoBtn('pencil', 'Редактировать', 'data-edit') +
        icoBtn('trash', 'Удалить', 'data-del', 'danger') + '</div></div>';
  }

  // Корзина — все команды страницы (текущая первой): после перезагрузки страница
  // открывается на первой команде, и заметки остальных не должны «пропадать».
  function renderNotes() {
    var cur = team.slug, groups = [];
    TEAMS.forEach(function (t) {
      inTeam(t.slug, function () {
        var l = loadComments();
        groups.push({ t: t, list: l, prompt: buildPrompt(l) });
      });
    });
    groups.sort(function (a, b) { return (b.t.slug === cur) - (a.t.slug === cur); });
    var total = groups.reduce(function (a, g) { return a + g.list.length; }, 0);
    var multi = groups.filter(function (g) { return g.list.length; }).length > 1 || (TEAMS.length > 1 && total);
    document.getElementById('cCount').textContent = total;
    var box = document.getElementById('itemsList');
    box.innerHTML = groups.filter(function (g) { return g.list.length; }).map(function (g) {
      return (multi ? '<div class="nteam">' + esc(g.t.team) + ' · ' + g.list.length + '</div>' : '') +
        g.list.map(function (c) { return noteItemHtml(c, g.t.slug, g.t.sprintName); }).join('');
    }).join('');
    var empty = document.getElementById('nEmpty');
    if (!total && !empty) {
      box.insertAdjacentHTML('beforebegin', '<p class="nempty" id="nEmpty">Заметок пока нет. Правый клик по строке отчёта — заметка к ней.</p>');
    } else if (total && empty) {
      empty.remove();
    }
    var prompt = groups.map(function (g) { return g.prompt; }).filter(Boolean).join('\n\n');
    document.getElementById('promptOut').value = prompt;
    document.getElementById('copyBtn').disabled = !prompt;
    document.getElementById('clearAll').disabled = !total;

    box.querySelectorAll('.nrow').forEach(function (item) {
      var id = item.dataset.id, slug = item.dataset.team;
      var q = function (sel) { return item.querySelector(sel); };
      if (q('[data-del]')) q('[data-del]').addEventListener('click', function () {
        inTeam(slug, function () { saveComments(loadComments().filter(function (c) { return c.id !== id; })); });
        refreshComments();
      });
      if (q('[data-edit]')) q('[data-edit]').addEventListener('click', function () {
        editingId = id; renderNotes();
        var ta = box.querySelector('.nedit-text');
        ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
      });
      if (item.classList.contains('editing')) {
        var save = function () {
          // ключ не трогали — оставляем снимок сущности как был, а не пересобираем его
          var text = String(q('.nedit-text').value || '').trim(), ref = q('.nedit-ref').value.trim();
          if (text) {
            inTeam(slug, function () {
              var list = loadComments(), old = list.find(function (c) { return c.id === id; });
              var target = old && ref === refValue(old.target) ? old.target : resolveRef(ref);
              saveComments(list.map(function (c) {
                return c.id === id ? Object.assign({}, c, { text: text, target: target, editedAt: new Date().toISOString() }) : c;
              }));
            });
            editingId = null;
          }
          refreshComments();
        };
        var cancel = function () { editingId = null; renderNotes(); };
        [q('.nedit-text'), q('.nedit-ref')].forEach(function (el) {
          el.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); save(); }
            if (e.key === 'Escape') { e.stopPropagation(); cancel(); }
          });
        });
      }
    });
  }

  function setNotesOpen(open) {
    notesPanel.classList.toggle('open', open);
    notesToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (!open) editingId = null;
  }

  // сколько заметок у задачи и у эпика со всей его иерархией
  function commentCounts() {
    var byKey = {}, byRow = {};
    loadComments().forEach(function (c) {
      var t = c.target || {};
      if (t.key) byKey[t.key] = (byKey[t.key] || 0) + 1;
      if (t.rowId) byRow[t.rowId] = (byRow[t.rowId] || 0) + 1;
    });
    return { byKey: byKey, byRow: byRow };
  }

  function cmarkHtml(n) { return n ? '<span class="cmark" title="Заметок: ' + n + '">' + n + '</span>' : ''; }

  // «Очистить комментарии» — единственный способ стереть корзину целиком: все команды,
  // копии (backup, corrupt, старые ключи по спринтам) и IndexedDB — пустым списком, чтобы
  // ничего не восстановилось. Только после подтверждения.
  function clearAllComments() {
    var keys = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (TEAMS.some(function (t) { return k && (k.indexOf('actual-sprint:' + t.slug + ':comments') === 0 || k.indexOf('actual-sprint:' + t.slug + ':note:') === 0); })) keys.push(k);
      }
    } catch (e) { /* без хранилища — нечего стирать */ }
    keys.forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
    TEAMS.forEach(function (t) {
      var key = 'actual-sprint:' + t.slug + ':comments';
      lsSet(key, '[]');
      lsSet('actual-sprint:' + t.slug + ':notes-migrated', '1');   // заметки старого формата не возвращаются
      idbPut(key, '[]');
    });
  }
  document.getElementById('clearAll').addEventListener('click', function () {
    var n = +document.getElementById('cCount').textContent || 0;
    if (!n) return;
    if (!window.confirm('Удалить все комментарии (' + n + ') всех команд из памяти браузера? Вернуть их будет нельзя.')) return;
    clearAllComments();
    editingId = null;
    refreshComments();
  });

  // копия в IndexedDB догоняет localStorage, а очищенный localStorage — восстанавливается из неё
  restoreComments(function (restored) { if (restored) refreshComments(); });

  // ------------------------- бургер вместо шапки -------------------------
  // Кнопка «☰ команда · спринт» и меню с подробностями (shared/burger.html). Шаблон задаёт
  // burger.build() — разметку меню (bmSection/bmItem) и burger.label() — подпись кнопки.
  // Пункт data-bm-click="<id>" нажимает прежнюю кнопку страницы (она скрыта, логика та же).
  // Оболочка виджета (тот же origin) добавляет свои пункты: window.REPORT_MENU_EXTRA = [{label, sub, run}].
  var burger = { build: null, label: null };
  var burgerBtn = document.getElementById('burgerBtn');
  function bmItem(attr, label, sub, tail) {
    return '<button type="button" class="bm-item" ' + attr + '><span class="bm-main"><span class="bm-label">' + esc(label) + '</span>' +
      (sub ? '<span class="bm-sub">' + esc(sub) + '</span>' : '') + '</span>' + (tail == null ? '<span class="bm-go">›</span>' : tail) + '</button>';
  }
  function bmSection(title, html) { return '<section class="bm-sec">' + (title ? '<h3>' + esc(title) + '</h3>' : '') + html + '</section>'; }
  function burgerExtra() { var x = window.REPORT_MENU_EXTRA; return Array.isArray(x) ? x : []; }
  function burgerIsOpen() { return !!burgerBtn && !document.getElementById('burgerMenu').hidden; }
  function renderBurger() {
    if (!burgerBtn || !burger.build) return;
    var extra = burgerExtra();
    document.getElementById('burgerBody').innerHTML = burger.build() + (extra.length ? bmSection('Виджет', extra.map(function (x, i) {
      return bmItem('data-bm-extra="' + i + '"', x.label, x.sub); }).join('')) : '');
  }
  function refreshBurger() {
    if (!burgerBtn) return;
    document.getElementById('burgerLabel').textContent = burger.label ? burger.label() : '';
    var n = +(document.getElementById('cCount') || {}).textContent || 0, badge = document.getElementById('burgerBadge');
    badge.hidden = !n;
    badge.textContent = n;
    badge.title = n ? 'Комментариев: ' + n : '';
    if (burgerIsOpen()) renderBurger();
  }
  function setBurgerOpen(open) {
    if (!burgerBtn) return;
    if (open) renderBurger();
    document.getElementById('burgerMenu').hidden = !open;
    document.getElementById('burgerScrim').hidden = !open;
    burgerBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    document.body.classList.toggle('burger-open', open);
  }
  if (burgerBtn) {
    burgerBtn.addEventListener('click', function () { setBurgerOpen(!burgerIsOpen()); });
    document.getElementById('burgerClose').addEventListener('click', function () { setBurgerOpen(false); });
    document.getElementById('burgerScrim').addEventListener('click', function () { setBurgerOpen(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && burgerIsOpen()) setBurgerOpen(false); });
    document.getElementById('burgerBody').addEventListener('click', function (e) {
      var x = e.target.closest('[data-bm-extra]');
      if (x) { setBurgerOpen(false); var it = burgerExtra()[+x.dataset.bmExtra]; if (it && it.run) it.run(); return; }
      var c = e.target.closest('[data-bm-click]');
      if (!c) return;
      var target = document.getElementById(c.dataset.bmClick);
      if (!c.hasAttribute('data-bm-stay')) setBurgerOpen(false);
      if (target) target.click();
      if (c.hasAttribute('data-bm-stay')) renderBurger();
    });
  }

  function refreshComments() {
    renderNotes();
    var counts = commentCounts();
    pageMarks(counts);          // метки своей страницы: строки эпиков у отчёта PO, слайды у бизнес-отчёта
    document.querySelectorAll('[data-cmark]').forEach(function (el) {
      el.innerHTML = cmarkHtml(counts.byKey[el.dataset.cmark] || 0);
    });
    refreshBurger();
  }

  // --- поле заметки по правому клику: сразу с привязкой к строке
  var cpop = document.getElementById('cpop');
  var cpopText = document.getElementById('cpopText');
  var cpopTarget = null;

  function renderPopExisting(target) {
    var box = document.getElementById('cpopExisting');
    var list = target.key ? loadComments().filter(function (c) { return c.target && c.target.key === target.key; }) : [];
    box.hidden = !list.length;
